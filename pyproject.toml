[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdna4-tuner"
version = "0.1.0"
description = "Crash-recoverable Radeon tuning logic; simulated hardware only"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
rdna4-tuner = "tuner.cli:main"

[tool.setuptools.packages.find]
include = ["tuner*"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: 1000 seeded cards per preset and simulated profile"]
